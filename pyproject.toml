[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finreport-agent"
version = "0.1.0"
description = "Evidence-linked annual filing analysis with deterministic calculations and validated citations"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
finreport = "finreport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Default run = tests/dev only. The five fixtures under tests/heldout are development/regression
# evidence (see tests/heldout/EXPOSURE_LOG.md); run them explicitly:
#   pytest tests/heldout
testpaths = ["tests/dev"]
addopts = "-ra"
