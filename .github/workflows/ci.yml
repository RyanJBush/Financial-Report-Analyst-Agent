name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python scripts/demo.py > demo.log
      - run: python -m pytest tests/dev tests/heldout -q
      - run: python scripts/evaluate_answers.py
      - run: python evidence/independent_audit.py data/cache/msft-20240630.htm > source-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-python-${{ matrix.python }}
          path: |
            output/*.json
            demo.log
            source-audit.log
