name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Development tests (offline; no SEC or model access)
        run: python -m pytest -q tests/dev
      - name: Regression fixtures (five exposed cases; development evidence, not held-out)
        run: python -m pytest -q tests/heldout
      - name: Offline demo (three questions, scripted narrative)
        run: finreport demo
      - name: Frozen answer cases
        run: finreport eval-answers --out answer_eval_report.json
      - name: Frozen extraction expectations are unmodified
        run: sha256sum -c evaluation/expected_facts.sha256 && sha256sum -c evaluation/answer_cases.sha256
